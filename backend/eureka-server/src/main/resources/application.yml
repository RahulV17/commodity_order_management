server:
  port: 8761

spring:
  application:
    name: eureka-server

eureka:
  client:
    # A standalone registry does not need to register with, or fetch from, itself.
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  server:
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

info:
  app:
    name: ${spring.application.name}
    description: Eureka service registry for the commodity order management system
    version: 1.0.0

logging:
  level:
    root: INFO
    com.netflix.eureka: WARN
    com.netflix.discovery: WARN
