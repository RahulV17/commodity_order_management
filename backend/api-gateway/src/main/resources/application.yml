server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          # Routes are declared explicitly below; the discovery locator would expose
          # every service under an extra /SERVICE-ID/** path.
          enabled: false
      routes:
        - id: auth-route
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/api/auth/**
        - id: order-route
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/api/orders/**
        - id: instrument-route
          uri: lb://INSTRUMENT-SERVICE
          predicates:
            - Path=/api/instruments/**
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOriginPatterns:
              - "http://localhost:*"
              - "http://127.0.0.1:*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            exposedHeaders:
              - X-Request-Id
            allowCredentials: false
            maxAge: 3600

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    health:
      show-details: always
    gateway:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Spring Cloud Gateway - single entry point for the Angular application
    version: 1.0.0

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: INFO
    reactor.netty: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{requestId:-}] %logger{36} - %msg%n"
