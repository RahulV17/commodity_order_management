name: commodity-order-management

# ---------------------------------------------------------------------------
# Full local stack: infrastructure, Eureka, gateway, two services, Angular.
#
# Host ports are published for the browser-facing pieces and for inspection:
#   frontend 4200 | gateway 8080 | order 8081 | instruments 8082 | Eureka 8761
#   PostgreSQL 5432 | MongoDB 27017 | Kafka 9092 (external listener)
# Redis is intentionally internal; a host-side Redis on 6379 keeps working for
# the non-Docker development path (see README).
# ---------------------------------------------------------------------------

services:
  postgres:
    image: postgres:16-alpine
    container_name: com-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orderdb}
      POSTGRES_USER: ${POSTGRES_USER:-orderuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orderpass}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orderuser} -d ${POSTGRES_DB:-orderdb}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: com-mongo
    environment:
      MONGO_INITDB_DATABASE: instrumentdb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # mongosh can take >5s to answer on a loaded host; a too-short timeout
      # marks a healthy Mongo as DOWN and blocks every dependent service.
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 15s
      timeout: 20s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: com-redis
    command: ["redis-server", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  kafka:
    # Redpanda is wire-compatible with the Kafka protocol (Kafka API 3.x), so
    # the existing spring-kafka producers/consumers work unchanged. It is used
    # here instead of apache/kafka because the apache image's entrypoint
    # rejects multi-listener advertised addresses on this host ("cannot use the
    # nonroutable meta-address 0.0.0.0"), while Redpanda starts cleanly.
    image: redpandadata/redpanda:latest
    container_name: com-kafka
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr=internal://kafka:29092,external://localhost:9092
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://kafka:8082,external://localhost:18082
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --node-id=0
      - --check=false
      - --default-log-level=info
    ports:
      - "9092:9092"
      - "18082:18082"
    volumes:
      - kafka-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  eureka-server:
    build:
      context: ./backend
      args:
        SERVICE: eureka-server
    container_name: com-eureka
    environment:
      EUREKA_HOST: localhost
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", 'wget -qO- http://localhost:8761/actuator/health | grep -q "\"status\":\"UP\""']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  instrument-service:
    build:
      context: ./backend
      args:
        SERVICE: instrument-service
    container_name: com-instrument-service
    environment:
      MONGODB_URI: mongodb://mongo:27017/instrumentdb
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-ncdex-commodity-order-management-hmac-secret-2026}
      INSTRUMENT_CACHE_TTL_SECONDS: ${INSTRUMENT_CACHE_TTL_SECONDS:-300}
    ports:
      - "8082:8082"
    depends_on:
      eureka-server:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", 'wget -qO- http://localhost:8082/actuator/health | grep -q "\"status\":\"UP\""']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  order-service:
    build:
      context: ./backend
      args:
        SERVICE: order-service
    container_name: com-order-service
    environment:
      POSTGRES_URL: jdbc:postgresql://postgres:5432/orderdb
      POSTGRES_USER: ${POSTGRES_USER:-orderuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orderpass}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-ncdex-commodity-order-management-hmac-secret-2026}
      DEMO_ADMIN_PASSWORD: ${DEMO_ADMIN_PASSWORD:-Admin@123}
      DEMO_OPERATOR_PASSWORD: ${DEMO_OPERATOR_PASSWORD:-Operator@123}
      SEED_DATA: ${SEED_DATA:-true}
      STORAGE_TYPE: ${STORAGE_TYPE:-local}
      STORAGE_LOCAL_DIR: /app/uploads
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_S3_ENDPOINT: ${AWS_S3_ENDPOINT:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    ports:
      - "8081:8081"
    volumes:
      - order-uploads:/app/uploads
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      instrument-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", 'wget -qO- http://localhost:8081/actuator/health | grep -q "\"status\":\"UP\""']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 50s
    restart: unless-stopped

  api-gateway:
    build:
      context: ./backend
      args:
        SERVICE: api-gateway
    container_name: com-api-gateway
    environment:
      EUREKA_URL: http://eureka-server:8761/eureka/
    ports:
      - "8080:8080"
    depends_on:
      eureka-server:
        condition: service_healthy
      instrument-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", 'wget -qO- http://localhost:8080/actuator/health | grep -q "\"status\":\"UP\""']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: com-frontend
    ports:
      - "4200:80"
    depends_on:
      api-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/healthz | grep -q ok"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
  mongo-data:
  kafka-data:
  order-uploads:
